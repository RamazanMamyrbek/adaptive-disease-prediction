[project]
name = "t2d-adaptive-acquisition"
version = "0.1.0"
description = "Research prototype for cost-aware adaptive clinical feature acquisition in incident T2D prediction."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "joblib>=1.4,<2",
    "PyYAML>=6,<7",
    "openpyxl>=3.1,<4",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
survival = ["statsmodels>=0.14,<1"]
app = ["fastapi>=0.115", "uvicorn>=0.30", "streamlit>=1.64,<2", "pydantic>=2.9"]
dev = ["pytest>=7.4,<9"]
reports = ["Markdown>=3.6,<4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
